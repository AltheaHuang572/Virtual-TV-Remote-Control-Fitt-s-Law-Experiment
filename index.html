<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virtual TV Remote Fitts' Law Experiment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .description {
            color: #555;
            margin-bottom: 25px;
        }

        /* Remote control body */
        #remote {
            width: 280px;
            margin: auto;
            padding: 25px 20px 30px;

            background-color: #202020;

            border-radius: 35px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.35);
        }

        /* General button */
        .remote-button {
            border: none;

            background-color: #eeeeee;
            color: #111;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;

            transition: 0.15s;
        }

        .remote-button:hover {
            background-color: #cccccc;
        }

        /* Top row */
        .top-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .power {
            width: 50px;
            height: 50px;

            border-radius: 50%;

            background-color: #d93636;
            color: white;
        }

        .menu {
            width: 50px;
            height: 50px;

            border-radius: 50%;
        }

        /* Navigation area */
        .navigation {
            display: grid;

            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 55px 55px 55px;

            justify-content: center;

            margin-bottom: 25px;
        }

        .nav-button {
            width: 50px;
            height: 50px;

            border-radius: 50%;
        }

        .up {
            grid-column: 2;
            grid-row: 1;
        }

        .left {
            grid-column: 1;
            grid-row: 2;
        }

        .ok {
            grid-column: 2;
            grid-row: 2;

            background-color: #555;
            color: white;
        }

        .right {
            grid-column: 3;
            grid-row: 2;
        }

        .down {
            grid-column: 2;
            grid-row: 3;
        }

        /* Volume / Channel */
        .control-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
        }

        .long-button {
            width: 65px;
            height: 70px;

            border-radius: 12px;

            font-size: 14px;
        }

        /* Number pad */
        .number-pad {
            display: grid;

            grid-template-columns:
                repeat(3, 55px);

            gap: 12px;

            justify-content: center;
        }

        .number-button {
            width: 55px;
            height: 55px;

            border-radius: 50%;
        }

        /* Bottom buttons */
        .bottom-row {
            display: flex;
            justify-content: space-around;

            margin-top: 25px;
        }

        .bottom-button {
            width: 75px;
            height: 40px;

            border-radius: 10px;

            font-size: 13px;
        }
/* Experiment Panel */

.experiment-panel {
    margin-bottom: 25px;
}

#start-button {
    padding: 12px 25px;
    font-size: 16px;
    font-weight: bold;

    border: none;
    border-radius: 8px;

    background-color: #2d7ff9;
    color: white;

    cursor: pointer;
}

#start-button:hover {
    background-color: #1d63c7;
}

#start-button:disabled {
    background-color: #999;
    cursor: not-allowed;
}


/* Highlighted Target */

.target {
    background-color: #ffd633 !important;

    outline: 5px solid #ff9800;

    box-shadow: 0 0 18px #ffd633;

    transform: scale(1.08);
}
        
#download-button {
    padding: 12px 25px;
    margin-left: 10px;

    font-size: 16px;
    font-weight: bold;

    border: none;
    border-radius: 8px;

    background-color: #28a745;
    color: white;

    cursor: pointer;
}

#download-button:disabled {
    background-color: #999;
    cursor: not-allowed;
}
        
    </style>
</head>

<body>

    <h1>
        Virtual TV Remote Control
    </h1>

    <p class="description">
    Click the highlighted button as quickly and accurately as possible.
</p>


<!-- Experiment Status -->
<div class="experiment-panel">

    <button id="start-button">
        Start Experiment
    </button>
    
    <button id="download-button" disabled>
    Download CSV
    </button>
    
    <p id="status">
        Press Start Experiment to begin.
    </p>

    <p>
        Trial:
        <strong id="trial-count">0</strong>
        /
        <strong id="total-trials">100</strong>

        &nbsp;&nbsp;

        Misses:
        <strong id="miss-count">0</strong>
    </p>

</div>


<!-- Remote Control -->
<div id="remote">


        <!-- Top Buttons -->
        <div class="top-row">

            <button
                class="remote-button target-button power" data-name="Power">
                ⏻
            </button>

            <button
                class="remote-button target-button menu" data-name="menu">
                MENU
            </button>

        </div>


        <!-- Navigation Buttons -->
        <div class="navigation">

    <button
        class="remote-button target-button nav-button up"
        data-name="Up">
        ▲
    </button>

    <button
        class="remote-button target-button nav-button left"
        data-name="Left">
        ◀
    </button>

    <button
        class="remote-button target-button nav-button ok"
        data-name="OK">
        OK
    </button>

    <button
        class="remote-button target-button nav-button right"
        data-name="Right">
        ▶
    </button>

    <button
        class="remote-button target-button nav-button down"
        data-name="Down">
        ▼
    </button>

        </div>


        <!-- Volume / Channel -->
        <div class="control-row">

    <button
        class="remote-button target-button long-button"
        data-name="Volume">
        VOL<br>+ / −
    </button>

    <button
        class="remote-button target-button long-button"
        data-name="Channel">
        CH<br>+ / −
    </button>

</div>


        <!-- Number Pad -->
        <div class="number-pad">

            <button class="remote-button target-button number-button" data-name="1">1</button>
            <button class="remote-button target-button number-button" data-name="2">2</button>
            <button class="remote-button target-button number-button" data-name="3">3</button>

            <button class="remote-button target-button number-button" data-name="4">4</button>
            <button class="remote-button target-button number-button" data-name="5">5</button>
            <button class="remote-button target-button number-button" data-name="6">6</button>

            <button class="remote-button target-button number-button" data-name="7">7</button>
            <button class="remote-button target-button number-button" data-name="8">8</button>
            <button class="remote-button target-button number-button" data-name="9">9</button>

            <button class="remote-button target-button number-button" data-name="Star">*</button>
            <button class="remote-button target-button number-button" data-name="0">0</button>
            <button class="remote-button target-button number-button" data-name="Hash">#</button>

        </div>


        <!-- Bottom Buttons -->
<div class="bottom-row">

    <button
        class="remote-button target-button bottom-button"
        data-name="Back">
        BACK
    </button>

    <button
        class="remote-button target-button bottom-button"
        data-name="Home">
        HOME
    </button>

</div>

    </div>

    <script>
        
        // =========================
        // Experiment Settings
        // =========================
        
        const TOTAL_TRIALS = 100;

        let currentTrial = 0;
        let totalMisses = 0;
        let trialMisses = 0;

        let currentTarget = null;
        let previousTarget = null;

        let targetAppearTime = 0;
        
        let experimentRunning = false;
        
        // Store all experimental data
         let experimentData = [];

        // Get HTML elements
        const targetButtons =
            Array.from(document.querySelectorAll(".target-button"));

        const startButton =
            document.getElementById("start-button");

        const downloadButton = 
            document.getElementById("download-button");

        const statusText =
            document.getElementById("status");

        const trialCount =
            document.getElementById("trial-count");

        const missCount =
            document.getElementById("miss-count");

        const totalTrials =
            document.getElementById("total-trials");


        totalTrials.textContent = TOTAL_TRIALS;


        // =========================
        // Start Experiment
        // =========================

        startButton.addEventListener("click", function () {

            currentTrial = 0;
            
            totalMisses = 0;
            trialMisses = 0;

            experimentData = [];
            
            currentTarget = null;
            previousTarget = null;
            
            experimentRunning = true;

            trialCount.textContent = 0;
            missCount.textContent = 0;

            startButton.disabled = true;
            downloadButton.disabled = true;
            
            statusText.textContent =
                "Click the highlighted button!";

            generateNextTarget();

        });


        // =========================
        // Generate Next Target
        // =========================

        function generateNextTarget() {

            // Remove previous highlight
            targetButtons.forEach(function (button) {
                button.classList.remove("target");
            });


            // Experiment finished
            if (currentTrial >= TOTAL_TRIALS) {

                experimentRunning = false;
                currentTarget = null;

                statusText.textContent =
                    "Experiment completed! You can now download the CSV file.";

                startButton.disabled = false;
                startButton.textContent =
                    "Restart Experiment";

                downloadButton.disabled = false;

                return;
            }


            // Select random target
            let nextTarget;

            do {

                const randomIndex =
                    Math.floor(Math.random() * targetButtons.length);

                nextTarget =
                    targetButtons[randomIndex];

            } 
            while (nextTarget === currentTarget);

 // Previous target becomes starting position
            previousTarget = currentTarget;
            
            // set new target
            currentTarget = nextTarget;

            currentTarget.classList.add("target");
            
            console.log("New Target:", currentTarget.dataset.name);

            //reset miss count for this trail
            trailMisses = 0;

            //start MT timer
            targetAppearTime = performance.now();
            

        }


        // =========================
        // Handle Button Click
        // =========================

        targetButtons.forEach(function (button) {

            button.addEventListener("click", function () {

                if (!experimentRunning) {
                    return;
                }


                // Correct target
                if (button === currentTarget) {

                    //stop timer
                    const clickTime = 
                        performance.now();
                    
                    const movementTime = 
                        clickTime - targetAppearTime;
                    
                // First target has no previous target,
                // therefore A cannot be calculated.
                if (previousTarget !== null) {
                    
                     // Calculate centers
                    const startRect =
                        previousTarget.getBoundingClientRect();

                    const targetRect =
                        currentTarget.getBoundingClientRect();


                    const startX =
                        startRect.left +
                        startRect.width / 2;

                    const startY =
                        startRect.top +
                        startRect.height / 2;


                    const targetX =
                        targetRect.left +
                        targetRect.width / 2;

                    const targetY =
                        targetRect.top +
                        targetRect.height / 2;

                    //distance A
                    const deltaX = 
                        targetX - startX;

                    const deltaY = 
                        targetY - startY;

                    const A = 
                        Math.sqrt(
                            deltaX * deltaX + 
                            deltaY * deltaY
                        );

                    //target width W
                    const W = 
                        Math.min(
                            targetRect.width,
                            targetRect.height
                        );

                     // Fitts' Law ID
                    const ID = 
                        Math.log2(
                            A / W + 1
                        );

                    //Save trial
                    experimentData.push({
                        
                        Trial:
                            currentTrial + 1,

                        Start:
                            previousTarget.dataset.name,
                        
                        Target:
                            currentTarget.dataset.name,
                        A:
                            A.toFixed(2),
                            
                        W:
                            W.toFixed(2),
                    
                        ID:
                            ID.toFixed(4),
                        
                        MT:
                            movementTime.toFixed(2),
                        
                        Miss:
                            trialMisses
                    });

                    console.log(
                        experimentData[
                            experimentData.length - 1
                        ]
                    );
                }

                    // Trial completed
                    currentTrial++;

                    trialCount.textContent =
                        currentTrial;

                    statusText.textContent =
                        "Correct!";

                    generateNextTarget();

                }

                // Miss
                else {

                    totalMisses++;
                    trialMisses++;
                    

                    missCount.textContent =
                        totalMisses;

                    statusText.textContent =
                        "Miss! Try the highlighted button.";

                }

            });

        });
        
        // Download CSV
        downloadButton.addEventListener(
        "click",
        function () {


            if (experimentData.length === 0) {

                return;

            }


            const headers = [

                "Trial",
                "Start",
                "Target",
                "A_px",
                "W_px",
                "ID_bits",
                "MT_ms",
                "Miss"

            ];


            let csv =
                headers.join(",") + "\n";


            experimentData.forEach(
                function (row) {

                    csv += [

                        row.Trial,
                        row.Start,
                        row.Target,
                        row.A,
                        row.W,
                        row.ID,
                        row.MT,
                        row.Miss

                    ].join(",") + "\n";

                }
            );


            // Create CSV file
            const blob =
                new Blob(
                    [csv],
                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "fitts_law_remote_data.csv";


            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            URL.revokeObjectURL(url);

        }
    );

// ==========================================
// Analyze Button Distances
// ==========================================

function analyzeButtonDistances() {

    const results = [];

    for (let i = 0; i < targetButtons.length; i++) {

        for (let j = i + 1; j < targetButtons.length; j++) {

            const buttonA = targetButtons[i];
            const buttonB = targetButtons[j];

            const rectA = buttonA.getBoundingClientRect();
            const rectB = buttonB.getBoundingClientRect();

            const xA = rectA.left + rectA.width / 2;
            const yA = rectA.top + rectA.height / 2;

            const xB = rectB.left + rectB.width / 2;
            const yB = rectB.top + rectB.height / 2;

            const dx = xB - xA;
            const dy = yB - yA;

            const distance = Math.sqrt(
                dx * dx + dy * dy
            );

            results.push({
                From: buttonA.dataset.name,
                To: buttonB.dataset.name,
                Distance_px: Number(distance.toFixed(2))
            });
        }
    }

    results.sort(function(a, b) {
        return a.Distance_px - b.Distance_px;
    });

    console.table(results);

    return results;
}
        
    </script>
        
</body>

</html>
